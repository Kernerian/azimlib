name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -I tools/run_release_checks.py --kind unit --output .ci-results/unit
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - shell: bash
        run: |
          python -I tools/audit_distribution.py --wheel dist/*.whl --sdist dist/*.tar.gz --output .ci-results/distribution.json
      - run: python -I tools/smoke_installed_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
  accelerator:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[png,accelerate]'
      - run: python -I tools/run_release_checks.py --kind accelerator --output .ci-results/accelerator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accelerator-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[gui]'
      - name: Ensure virtual display on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Real Tk integration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -I tools/run_release_checks.py --kind desktop --output .ci-results/desktop
      - name: Real Tk integration on Windows/macOS
        if: runner.os != 'Linux'
        run: python -I tools/run_release_checks.py --kind desktop --output .ci-results/desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
