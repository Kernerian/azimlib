name: thematic-primitives-0.5
on:
  push:
    branches: [dev/0.5.0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thematic-primitives-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  native-thematic-contracts:
    if: github.ref == 'refs/heads/dev/0.5.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install '.[png]'
      - run: python -m unittest discover -s tests -p 'test_thematic*050.py' -v
      - run: python examples/thematic/primitives_050.py --output .ci-results/gallery
      - run: python tools/benchmark_thematic.py --output .ci-results/benchmark.json
      - name: Linux native display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Tk on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/smoke_thematic_tk.py --output .ci-results/tk.json
      - name: Tk on Windows/macOS
        if: runner.os != 'Linux'
        run: python tools/smoke_thematic_tk.py --output .ci-results/tk.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-c-${{ runner.os }}-py314
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
