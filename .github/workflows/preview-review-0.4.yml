name: preview-review-0.4
on:
  workflow_dispatch:
  push:
    branches: [validation/0.4-preview]
permissions:
  contents: read
jobs:
  contracts-without-gpu:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk libegl1 libgl1
      - run: python -m pip install '.[png,qt]' numpy
      - run: python -m unittest discover -s tests -p test_view_preview_040.py -v
      - run: python -m unittest discover -s tests -p test_gpu_040.py -v
      - run: python -m unittest discover -s tests -p test_gpu_preparation_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_corpus_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_validation_040.py -v
      - run: python -m unittest discover -s tests -p test_exact_layout_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_spatial_040.py -v
      - run: python -m unittest discover -s tests -p test_gpu_packets_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_global_metric_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_corrections_040.py -v
      - run: python -m unittest discover -s tests -p test_gpu_indexed_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_sections_040.py -v
      - run: python -m unittest discover -s tests -p test_solar_disk_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_temporal_040.py -v
      - run: python -m unittest discover -s tests -p test_retained_composition_040.py -v
      - run: python -m unittest discover -s tests -p test_projected_paths.py -v
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -I tools/validate_preview_portability.py --backend tk --output preview-review
      - if: runner.os != 'Linux'
        run: python -I tools/validate_preview_portability.py --backend tk --output preview-review
      - run: python -I tools/validate_preview_portability.py --backend qt --output preview-review
      - run: python -I tools/audit_licenses.py --report preview-review/licenses.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-contracts-${{ runner.os }}-${{ runner.arch }}-no-hardware-gpu
          path: preview-review/
          retention-days: 30
  mesa-contracts-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZIMLIB_GPU_TEST: '1'
      AZIMLIB_GPU_CONTEXT: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - run: python -m pip install '.[gpu]' numpy
      - run: python -m unittest discover -s tests -p test_view_preview_040.py -v
      - run: python -m unittest discover -s tests -p test_gpu_preparation_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_corpus_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_validation_040.py -v
      - run: python -m unittest discover -s tests -p test_exact_layout_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_spatial_040.py -v
      - run: python -m unittest discover -s tests -p test_gpu_packets_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_global_metric_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_corrections_040.py -v
      - run: python -m unittest discover -s tests -p test_gpu_indexed_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_sections_040.py -v
      - run: python -m unittest discover -s tests -p test_solar_disk_040.py -v
      - run: python -m unittest discover -s tests -p test_eclipse_temporal_040.py -v
      - run: python -m unittest discover -s tests -p test_retained_composition_040.py -v
      - run: python -m unittest discover -s tests -p test_gpu_040.py -v
      - run: python -I tools/validate_gpu.py --context egl --output mesa-contracts
      - uses: actions/upload-artifact@v4
        with:
          name: preview-mesa-software-contracts-not-performance
          path: mesa-contracts/
          retention-days: 30
