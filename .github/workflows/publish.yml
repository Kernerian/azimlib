name: publish
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python -I tools/check_publish_ci.py --repository "$RELEASE_REPOSITORY" --sha "$RELEASE_SHA"
      - run: python -m pip install '.[dev]'
      - run: python -I tools/audit_licenses.py --report .ci-results/licenses.json
      - run: python -I tools/audit_publication_privacy.py --report .ci-results/privacy-source.json
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -I tools/audit_distribution.py --wheel dist/*.whl --sdist dist/*.tar.gz --output .ci-results/distribution.json
      - run: python -I tools/audit_publication_privacy.py --archive dist/*.whl --archive dist/*.tar.gz --report .ci-results/privacy-archives.json
      - run: python -I tools/smoke_installed_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distribution-audits
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/azimlib/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish audited distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
