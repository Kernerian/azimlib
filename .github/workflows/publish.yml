name: publish
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact audited version
        required: true
        type: string
      authorization_ref:
        description: Immutable commit of the separately versioned human authorization
        required: true
        type: string
      build_run_id:
        description: Successful canonical candidate build at the exact source SHA
        required: true
        type: string
      artifact_id:
        description: Exact audited distribution artifact
        required: true
        type: string
      wheel_sha256:
        description: Canonical audited wheel SHA-256
        required: true
        type: string
      sdist_sha256:
        description: Canonical audited sdist SHA-256
        required: true
        type: string
      dry_run:
        description: Validate all gates and bytes without publication
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: pypi-publication
  cancel-in-progress: false
jobs:
  build:
    if: (inputs.dry_run && github.ref == 'refs/heads/validation/0.4-candidate') || (!inputs.dry_run && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require successful CI for this exact main commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python -I tools/check_publish_ci.py --repository "$RELEASE_REPOSITORY" --sha "$RELEASE_SHA"
      - run: python -m pip install '.[dev]'
      - run: python -I tools/check_release_candidate.py --purpose prepare
      - name: Exact version and contextual state-machine preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          python -I -c "import os,azimlib; assert os.environ['RELEASE_VERSION'] == azimlib.__version__ == '0.4.0'"
          if [ "$DRY_RUN" = "true" ]; then
            MODE=dry-run
            EXPECTED_BRANCH=validation/0.4-candidate
          else
            MODE=publish
            EXPECTED_BRANCH=main
          fi
          python -I tools/release_preflight040.py --repository "$RELEASE_REPOSITORY" --sha "$RELEASE_SHA" \
            --authorization-ref "$AUTHORIZATION_REF" --expected-branch "$EXPECTED_BRANCH" --mode "$MODE" \
            --run-id "$BUILD_RUN_ID" --artifact-id "$ARTIFACT_ID" \
            --wheel-sha256 "$WHEEL_SHA256" --sdist-sha256 "$SDIST_SHA256" --output .ci-results/preflight
          mkdir dist
          cp .ci-results/preflight/dist/* dist/
      - run: python -I tools/audit_licenses.py --report .ci-results/licenses.json
      - run: python -I tools/audit_publication_privacy.py --report .ci-results/privacy-source.json
      - run: python -m twine check --strict dist/*
      - run: python -I tools/audit_distribution.py --wheel dist/*.whl --sdist dist/*.tar.gz --output .ci-results/distribution.json
      - run: python -I tools/audit_publication_privacy.py --archive dist/*.whl --archive dist/*.tar.gz --report .ci-results/privacy-archives.json
      - run: python -I tools/smoke_installed_package.py --wheel dist/azimlib-0.4.0-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distribution-audits
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/azimlib/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish audited distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
